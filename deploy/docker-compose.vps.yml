# Production VPS stack — Morpho Blue Len Metabase + PostgreSQL

services:

  postgres:
    image: postgres:17
    container_name: morpho-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-morpho}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-morpho}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-morpho} -d ${POSTGRES_DB:-morpho}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - morpho-net
    # Analytics DB — not exposed publicly. Load data via pg_restore or pipeline on VPS.
    ports:
      - "127.0.0.1:5433:5432"

  metabase-db:
    image: postgres:17
    container_name: morpho-metabase-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: ${METABASE_DB_PASSWORD:?Set METABASE_DB_PASSWORD in .env}
      POSTGRES_DB: metabase
    volumes:
      - metabase_app_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase -d metabase"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - morpho-net

  metabase:
    image: metabase/metabase:${METABASE_VERSION:-latest}
    container_name: morpho-metabase
    restart: unless-stopped
    depends_on:
      metabase-db:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: metabase-db
      MB_DB_PORT: 5432
      MB_DB_USER: metabase
      MB_DB_PASS: ${METABASE_DB_PASSWORD}
      MB_DB_DBNAME: metabase
      JAVA_OPTS: -Xmx1g
    volumes:
      - metabase_plugins:/plugins
    networks:
      - morpho-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  caddy:
    image: caddy:2-alpine
    container_name: morpho-caddy
    restart: unless-stopped
    depends_on:
      - metabase
    ports:
      - "80:80"
      - "443:443"
    environment:
      METABASE_DOMAIN: ${METABASE_DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./Caddyfile.active:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - morpho-net

networks:
  morpho-net:
    driver: bridge

volumes:
  postgres_data:
  metabase_app_data:
  metabase_plugins:
  caddy_data:
  caddy_config:
